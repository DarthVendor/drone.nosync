# The 2x2 the paper rests on:
#   (structured vs unstructured genome) x (whitened vs isotropic mutation),
# matched on seed, population and evaluation budget.
#
# Cells are generated by scripts/ablate.py from this base; only `trainable` and
# `es.whiten` vary.  Single-seed results are not evidence -- run >= 5 seeds and
# report paired differences across seeds.
base:
  system: quadrotor
  task: waypoint_pair
  dtype: float64
  rollout: {n_eps: 8, ep_steps: 250}
  es: {pop: 48, gens: 60, sigma0: 0.15, elite_frac: 0.5, strategy: es,
       metric_every: 5, metric_states: 96, ridge: 1.0e-3
  null_mode: cap}

grid:
  trainable: [energy_shaping, mlp]   # structured vs unstructured
  whiten: [true, false]              # physics metric vs isotropic
seeds: [0, 1, 2, 3, 4]
